<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>CAMPGROUND TYCOON</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1d2b1a;
    font-family:Verdana,'Segoe UI',sans-serif;-webkit-user-select:none;user-select:none;
    touch-action:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
  #cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block;}
  #ui{position:absolute;inset:0;pointer-events:none;z-index:5;}
  #topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;
    padding:8px 10px;color:#fff;text-shadow:2px 2px 0 #000;flex-wrap:wrap;}
  .stat{background:rgba(10,25,10,.72);border:2px solid #d8f3c0;border-radius:10px;
    padding:5px 10px;font-size:15px;font-weight:bold;white-space:nowrap;}
  .stat small{display:block;font-size:9px;font-weight:normal;color:#cfe8b8;letter-spacing:1px;}
  #spdBox{margin-left:auto;display:flex;gap:6px;pointer-events:auto;}
  .sbtn{background:rgba(10,25,10,.72);border:2px solid #d8f3c0;border-radius:10px;color:#fff;
    font-size:16px;min-width:44px;height:40px;cursor:pointer;font-family:inherit;font-weight:bold;}
  .sbtn.on{background:#3f7a2e;border-color:#fff;}
  #muteBtn{pointer-events:auto;background:rgba(10,25,10,.72);border:2px solid #d8f3c0;border-radius:10px;
    color:#fff;font-size:16px;width:44px;height:40px;cursor:pointer;}
  #toolbar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:6px;padding:8px;
    overflow-x:auto;pointer-events:auto;background:rgba(8,18,8,.78);border-top:2px solid #d8f3c0;
    scrollbar-width:none;}
  #toolbar::-webkit-scrollbar{display:none;}
  .tool{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:64px;padding:6px 4px;border-radius:10px;border:2px solid #9db98a;background:#274a22;
    color:#fff;font-family:inherit;cursor:pointer;font-size:11px;line-height:1.3;}
  .tool .em{font-size:22px;}
  .tool .ct{font-size:10px;color:#ffe14d;font-weight:bold;}
  .tool.on{border-color:#ffe14d;background:#3f7a2e;box-shadow:0 0 8px #ffe14d;}
  #panel{position:absolute;right:10px;top:64px;width:230px;max-width:72vw;background:rgba(12,26,12,.94);
    border:3px solid #ffe14d;border-radius:12px;color:#fff;padding:12px;display:none;pointer-events:auto;
    text-shadow:1px 1px 0 #000;}
  #panel h3{margin:0 0 6px;font-size:16px;color:#ffe14d;}
  #panel .row{display:flex;align-items:center;justify-content:space-between;margin:7px 0;font-size:13px;}
  #panel .pbtn{background:#3f7a2e;border:2px solid #fff;color:#fff;border-radius:8px;font-family:inherit;
    font-size:14px;font-weight:bold;padding:6px 10px;cursor:pointer;min-width:40px;}
  #panel .pbtn:disabled{opacity:.4;cursor:default;}
  #panel .wide{width:100%;margin-top:6px;font-size:13px;}
  #panelClose{position:absolute;top:4px;right:8px;background:none;border:none;color:#fff;font-size:18px;cursor:pointer;}
  #toast{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.8);
    color:#ffe14d;border:2px solid #ffe14d;border-radius:10px;padding:8px 16px;font-size:15px;font-weight:bold;
    opacity:0;transition:opacity .25s;white-space:nowrap;max-width:92vw;text-shadow:1px 1px 0 #000;}
  #hint{position:absolute;bottom:86px;left:0;right:0;text-align:center;color:#e8f5d8;font-size:12px;
    text-shadow:1px 1px 0 #000;opacity:.8;pointer-events:none;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui">
  <div id="topbar">
    <div class="stat"><small>CASH</small>💰 <span id="money">$12,000</span></div>
    <div class="stat"><small>DAY</small>📅 <span id="day">1</span></div>
    <div class="stat"><small>GUESTS</small>🏕️ <span id="guests">0</span></div>
    <div class="stat"><small>RATING</small>⭐ <span id="stars">3.0</span></div>
    <div id="spdBox">
      <button class="sbtn" id="spd0" title="pause">⏸</button>
      <button class="sbtn on" id="spd1" title="normal speed">▶</button>
      <button class="sbtn" id="spd2" title="fast">⏩</button>
      <button id="muteBtn" title="mute">🔊</button>
    </div>
  </div>
  <div id="toolbar">
    <button class="tool on" id="tool-select"><span class="em">🔍</span>Inspect</button>
    <button class="tool" id="tool-road"><span class="em">🛣️</span>Road<span class="ct">$15+</span></button>
    <button class="tool" id="tool-clear"><span class="em">🪓</span>Clear<span class="ct">$25</span></button>
    <button class="tool" id="tool-tent"><span class="em">⛺</span>Tent<span class="ct">$120</span></button>
    <button class="tool" id="tool-popup"><span class="em">🚐</span>Popup<span class="ct">$300</span></button>
    <button class="tool" id="tool-medium"><span class="em">🚚</span>Medium<span class="ct">$600</span></button>
    <button class="tool" id="tool-rv"><span class="em">🏕️</span>RV<span class="ct">$1000</span></button>
    <button class="tool" id="tool-pool"><span class="em">🏊</span>Pool<span class="ct">$900</span></button>
    <button class="tool" id="tool-bathroom"><span class="em">🚻</span>Bathroom<span class="ct">$550</span></button>
    <button class="tool" id="tool-store"><span class="em">🏪</span>Store<span class="ct">$1400</span></button>
    <button class="tool" id="tool-playground"><span class="em">🛝</span>Playgrnd<span class="ct">$750</span></button>
    <button class="tool" id="tool-bulldoze"><span class="em">💥</span>Raze<span class="ct">50%</span></button>
  </div>
  <div id="panel">
    <button id="panelClose">✕</button>
    <h3 id="panelTitle">Site</h3>
    <div id="panelBody"></div>
    <div class="row" id="priceRow" style="display:none">
      <span>Nightly price</span>
      <span><button class="pbtn" id="pPriceDown">−</button>
      <b id="pPriceVal">$25</b>
      <button class="pbtn" id="pPriceUp">+</button></span>
    </div>
    <button class="pbtn wide" id="pTableBtn" style="display:none">Add picnic table ($60)</button>
    <button class="pbtn wide" id="pFireBtn" style="display:none">Firepit: none</button>
    <button class="pbtn wide" id="pExpandBtn" style="display:none">Expand pool ($700)</button>
  </div>
  <div id="toast"></div>
  <div id="hint">tap a tool, then tap the map &nbsp;•&nbsp; drag = pan &nbsp;•&nbsp; pinch/wheel = zoom &nbsp;•&nbsp; v2026.09.26b</div>
</div>
<script>
